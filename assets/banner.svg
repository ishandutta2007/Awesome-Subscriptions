<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#3b82f6;#6366f1;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#8b5cf6;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulse-elem { animation: pulse 4s ease-in-out infinite; }
    .float-elem { animation: float 5s ease-in-out infinite; }
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .sub-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs -->
  <g filter="url(#glow)">
    <circle cx="200" cy="100" r="90" fill="#6366f1" opacity="0.25">
      <animate attributeName="cx" values="200;240;200" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;130;100" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="220" r="110" fill="#ec4899" opacity="0.2">
      <animate attributeName="cx" values="1020;980;1020" dur="7s" repeatCount="indefinite" />
      <animate attributeName="cy" values="220;190;220" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="290" r="80" fill="#38bdf8" opacity="0.18">
      <animate attributeName="r" values="80;105;80" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Flowing Dynamic Sine Wave -->
  <path d="M 0 280 Q 300 220 600 280 T 1200 280 L 1200 360 L 0 360 Z" fill="url(#cardGrad)" opacity="0.5" />
  <path d="M 0 300 C 300 260, 500 330, 800 290 C 1000 260, 1100 310, 1200 300" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4">
    <animate attributeName="d" 
      values="M 0 300 C 300 260, 500 330, 800 290 C 1000 260, 1100 310, 1200 300;
              M 0 290 C 300 320, 500 270, 800 310 C 1000 280, 1100 290, 1200 290;
              M 0 300 C 300 260, 500 330, 800 290 C 1000 260, 1100 310, 1200 300" 
      dur="9s" repeatCount="indefinite" />
  </path>

  <!-- Left Icon: Recurring Loop & Cards -->
  <g transform="translate(100, 110)" class="float-elem">
    <rect x="0" y="0" width="110" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <!-- Dynamic Rotating Ring -->
    <g transform="translate(55, 60)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="25 15" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </circle>
      <!-- Dollar / Metric Symbol -->
      <text x="0" y="8" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle" font-family="sans-serif">⚡</text>
    </g>
  </g>

  <!-- Center Text Content -->
  <g transform="translate(250, 125)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" font-size="12" fill="#a5b4fc" class="sub-text" font-weight="700">CURATED BILLING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" font-size="44" fill="url(#accentGrad)" class="title-text" filter="url(#softGlow)">
      Awesome Subscriptions
    </text>

    <!-- Tagline -->
    <text x="0" y="115" font-size="18" fill="#94a3b8" class="sub-text">
      The Ultimate Guide to SaaS &amp; Open-Source Billing, Metering &amp; Revenue Ops
    </text>
    
    <!-- Sub-tagline pills -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-size="13" fill="#64748b" class="sub-text">
        💳 Recurring Billing  •  ⚡ Usage-Based Metering  •  📈 Revenue Operations  •  🌐 Open-Source Engines
      </text>
    </g>
  </g>

  <!-- Right Floating Metric Cards -->
  <g transform="translate(980, 95)" class="float-elem">
    <!-- Card 1 -->
    <rect x="0" y="0" width="130" height="65" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="16" y="26" font-size="11" fill="#94a3b8" class="sub-text">SaaS &amp; Hosted</text>
    <text x="16" y="50" font-size="20" font-weight="800" fill="#38bdf8" class="title-text">20+ Tools</text>

    <!-- Card 2 -->
    <g transform="translate(-30, 80)">
      <rect x="0" y="0" width="150" height="65" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="16" y="26" font-size="11" fill="#94a3b8" class="sub-text">Open Source</text>
      <text x="16" y="50" font-size="20" font-weight="800" fill="#a855f7" class="title-text">140k+ ⭐</text>
    </g>
  </g>
</svg>
